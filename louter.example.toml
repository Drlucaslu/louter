# Louter Configuration
# Copy to louter.toml and edit (or just start without it for defaults)

[server]
host = "127.0.0.1"
port = 6188

[database]
path = "louter.db"

# Providers, API keys, and routing rules are configured through the Web UI
# at http://localhost:6188
#
# Key routing modes:
#   - failover: match model name patterns → try providers by priority (failover on error)
#   - content:  classify request content (code/math/translation/general) → route by type
#
# Examples:
#   failover mode rules:
#     claude-* → anthropic (priority 100)
#     claude-* → openai    (priority 50)   ← fallback if anthropic fails
#     gpt-*   → openai     (priority 100)
#     *       → ollama     (priority 10)   ← catch-all
#
#   content mode rules:
#     @code        → anthropic (priority 100)
#     @math        → openai    (priority 100)
#     @translation → ollama    (priority 100)
#     @general     → ollama    (priority 100)

# Distillation: automatically collect cloud responses as training data.
# Use distill/run_distill.sh to export, compress, fine-tune, and deploy.
# [distillation]
# collect_training_data = true             # default: true
# max_samples = 100000                     # prune oldest when exceeded
# only_successful = true                   # only collect status-200 responses
